services:
  - type: web
    name: apexflow-whatsapp-agent
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SAHIL_PHONE
        value: "918076541146"
