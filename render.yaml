services:
  - type: web
    name: apexflow-whatsapp-bot
    env: node
    plan: free
    region: frankfurt # Low-latency for UAE / Gulf region
    buildCommand: npm install
    startCommand: node scripts/whatsapp_agent.js
    autoDeploy: false # Keeps the container running 24/7 without wiping WhatsApp session on routine commits
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SAHIL_PHONE
        value: "918076541146"
      - key: GOOGLE_MEET_URL
        value: https://meet.google.com/ksd-sids-trc
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

