<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05ffa1"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Outer Cyber Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="3.5" />
  
  <!-- Subtle inner circuit grid -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-dasharray="4 4" stroke-width="1.5" />

  <!-- Stylized Founder Portrait Silhouette -->
  <!-- Shoulders & Suit -->
  <path d="M 40 178 C 42 138, 70 128, 100 128 C 130 128, 158 138, 160 178 Z" fill="url(#cyberGrad)" opacity="0.9" />
  <path d="M 82 128 L 100 152 L 118 128 Z" fill="#030712" />
  <path d="M 95 152 L 100 178 L 105 152 Z" fill="#00f2fe" />

  <!-- Neck -->
  <rect x="88" y="102" width="24" height="28" rx="4" fill="#fed7aa" />

  <!-- Head & Hair -->
  <ellipse cx="100" cy="78" rx="32" ry="38" fill="#fed7aa" />
  
  <!-- Modern Hairline -->
  <path d="M 68 70 C 68 45, 90 38, 102 38 C 122 38, 134 46, 134 68 C 134 72, 126 62, 118 60 C 104 56, 82 58, 68 70 Z" fill="#1e293b" />
  
  <!-- Stylish Eyewear / Modern Tech Frames -->
  <rect x="74" y="70" width="22" height="14" rx="3" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <rect x="104" y="70" width="22" height="14" rx="3" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <line x1="96" y1="76" x2="104" y2="76" stroke="#00f2fe" stroke-width="2" />
  <line x1="68" y1="75" x2="74" y2="75" stroke="#00f2fe" stroke-width="2" />
  <line x1="126" y1="75" x2="132" y2="75" stroke="#00f2fe" stroke-width="2" />

  <!-- Confident Smile -->
  <path d="M 88 98 Q 100 106 112 98" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />

  <!-- Verified Founder Badge at Bottom Right -->
  <g transform="translate(136, 136)">
    <circle cx="16" cy="16" r="16" fill="#030712" stroke="#05ffa1" stroke-width="2" />
    <path d="M 10 16 L 14 20 L 22 11" fill="none" stroke="#05ffa1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
