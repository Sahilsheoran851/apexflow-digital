<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="speedBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#05ffa1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowSpeed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="10" y="10" width="480" height="300" rx="16" fill="url(#speedBgGrad)" stroke="rgba(5, 255, 161, 0.2)" stroke-width="1.5"/>

  <!-- Left: Lighthouse 100 Gauge -->
  <g transform="translate(40, 45)">
    <!-- Outer Track -->
    <circle cx="100" cy="100" r="75" stroke="rgba(255, 255, 255, 0.08)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Active Progress Arc (100%) -->
    <circle cx="100" cy="100" r="75" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="471" stroke-dashoffset="0" filter="url(#glowSpeed)"/>
    
    <!-- Center Metric -->
    <text x="100" y="96" fill="#05ffa1" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="800" text-anchor="middle">100</text>
    <text x="100" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PERFORMANCE</text>
    
    <rect x="52" y="195" width="96" height="24" rx="12" fill="rgba(5, 255, 161, 0.12)" stroke="#05ffa1" stroke-width="1"/>
    <text x="100" y="211" fill="#05ffa1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">CORE WEB VITALS</text>
  </g>

  <!-- Right: Speed Benchmarks & 5G Edge -->
  <g transform="translate(255, 45)">
    <text x="0" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Sub-Second UAE 5G Speed</text>
    <text x="0" y="40" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">DUBAI_EDGE_NODE // 0.4ms RTT</text>

    <!-- Stat 1: LCP -->
    <g transform="translate(0, 55)">
      <rect width="205" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Largest Contentful Paint</text>
      <text x="193" y="26" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="end">0.42s</text>
    </g>

    <!-- Stat 2: INP -->
    <g transform="translate(0, 105)">
      <rect width="205" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(5, 255, 161, 0.2)" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Interaction to Next Paint</text>
      <text x="193" y="26" fill="#05ffa1" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="end">18ms</text>
    </g>

    <!-- Stat 3: CLS -->
    <g transform="translate(0, 155)">
      <rect width="205" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(157, 78, 221, 0.2)" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Cumulative Layout Shift</text>
      <text x="193" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="end">0.000</text>
    </g>
  </g>
</svg>
